# /etc/nginx/nginx.conf

daemon on;

# user nginx;

# Set number of worker processes automatically based on number of CPU cores.
worker_processes auto;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Configures default error logger.
error_log /var/log/nginx/error.log warn;

events {
	# The maximum number of simultaneous connections that can be opened by
	# a worker process.
	worker_connections 1024;
}

http {

   include mime.types;

   gzip on;
   gzip_proxied any;
   gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
   gzip_min_length 256;

   
   limit_req_zone $binary_remote_addr zone=mylimit:10m rate=2r/s;

    server {
        listen 443 ssl;
        server_name faster-than-light-memes.xyz www.faster-than-light-memes.xyz benjamin-schwerdtner.de www.benjamin-schwerdtner.de;
    ssl_certificate /etc/letsencrypt/live/benjamin-schwerdtner.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/benjamin-schwerdtner.de/privkey.pem; # managed by Certbot
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        keepalive_timeout 70;

        rewrite ^/cv.html$ /resume.html permanent;
        rewrite ^/memetic-engine-heores.html$ /memetic-engine-wizards.html permanent;

        location /janoshi/ {
            root /var/www/ftlm/;
            auth_basic "Privat";
            auth_basic_user_file /etc/nginx/.htpasswd_janoshi;

            location ^~ /janoshi/lachliste {
                proxy_pass http://127.0.0.1:8098;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location ^~ /janoshi/geomaxing {
                proxy_pass http://127.0.0.1:8099;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }

        location / {
            root /var/www/ftlm/;
        }

        location /search {
            limit_req zone=mylimit;
            proxy_pass http://localhost:8094/search;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # --- summerfest (begin) ---
        # Clojure app on 127.0.0.1:8096. The app strips /summerfest from :uri,
        # so we keep the prefix on the wire (no trailing slash on proxy_pass).
        location ^~ /summerfest {
            # Origin moved to the Hetzner box (2 vCPU / 3.8GB RAM) on 2026-08-06.
            # TLS with a pinned self-signed cert keeps session cookies off the
            # public internet on this hop; the origin ufw admits only this host.
            # Revert path: restore /etc/nginx/nginx.conf.pre-hetzner and start
            # the local app again (scripts/start.sh).
            proxy_pass https://49.12.218.29;
            proxy_ssl_name summerfest-origin;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/nginx/summerfest-origin.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /summerfest;
            # SSE chat stream + WebSocket need streaming, not buffering.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            client_max_body_size 30m;
            # Tell the browser to reach this host over HTTPS only. Guests who
            # logged in before the session cookie gained Secure still carry a
            # flag-less cookie; this stops it going out in the clear, because
            # the browser rewrites http:// to https:// before sending anything.
            # No includeSubDomains and no preload: scoped to this host, and
            # every vhost here already redirects http to https with a valid cert.
            add_header Strict-Transport-Security "max-age=15768000" always;
            # An over-limit photo is refused right here, before the app ever
            # sees it. Hand it to the gallery with an explanation rather than
            # showing the bare nginx 413 page. The = lets 303 replace the 413.
            error_page 413 = @summerfest_upload_too_big;
        }

        location @summerfest_upload_too_big {
            return 303 /summerfest/gallery?error=toobig;
        }
        # --- summerfest (end) ---

}

server {
    if ($host = faster-than-light-memes.xyz) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.faster-than-light-memes.xyz) {
        return 301 https://$host$request_uri;
    }
    
    if ($host = benjamin-schwerdtner.de) {
        return 301 https://$host$request_uri;
    }
    
    if ($host = www.benjamin-schwerdtner.de) {
        return 301 https://$host$request_uri;
    }

   

    # if ($host = benjamin-schwerdtner.de) {
    #     return 301 https://www.faster-than-light-memes.xyz$request_uri;
    # }

        listen 80;
        server_name benjamin-schwerdtner.de www.benjamin-schwerdtner.de faster-than-light-memes.xyz www.faster-than-light-memes.xyz;
        return 301 https://$host/;
        # return 404; # managed by Certbot

}

server {
    if ($host = beatperm.benjamin-schwerdtner.de) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name beatperm.benjamin-schwerdtner.de;
    return 301 https://$host$request_uri;

}

server {
    listen 443 ssl;
    server_name beatperm.benjamin-schwerdtner.de;
    ssl_certificate /etc/letsencrypt/live/benjamin-schwerdtner.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/benjamin-schwerdtner.de/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 70;

    root /var/www/beatperm;

    location / {
        try_files $uri $uri/ =404;
    }

}

server {
    if ($host = vehicles.faster-than-light-memes.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.vehicles.faster-than-light-memes.xyz) {
        return 301 https://$host$request_uri;
    }
    
    listen 80;
    server_name vehicles.faster-than-light-memes.xyz;
    return 301 https://$host$request_uri;

}

server {
    listen 443 ssl;
    server_name vehicles.faster-than-light-memes.xyz;
    ssl_certificate /etc/letsencrypt/live/benjamin-schwerdtner.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/benjamin-schwerdtner.de/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 70;
    # add_header X-Frame-Options "ALLOW-FROM https://faster-than-light-memes.xyz" always;
    # add_header X-Frame-Options "ALLOW-FROM https://benjamin-schwerdtner.de" always;
    # add_header X-Frame-Options "ALLOW-FROM https://benjamin-schwerdtner.de" always;
    add_header Content-Security-Policy "frame-ancestors https://faster-than-light-memes.xyz https://benjamin-schwerdtner.de";

  location / {
      proxy_pass http://127.0.0.1:8095;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

}
